server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: gp-api-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: gp-api
          service: gp-api
          environment: development
          __path__: /app/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: msg
            requestId: requestId
            method: method
            url: url
            statusCode: statusCode
            durationMs: durationMs
            error: err
      - labels:
          level:
          requestId:
          method:
          url:
          statusCode:
      - timestamp:
          format: RFC3339
          source: time